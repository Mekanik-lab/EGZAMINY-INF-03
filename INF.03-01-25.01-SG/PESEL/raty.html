<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kursy komputerowe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="baner.png" alt="kursy komputerowe">
    </header>
    <nav>
        <a href="index.html">Strona główna</a>
        <a href="raty.html">Koszt rat</a>
        <a href="https://moje-szkolenia.pl/">Nasz partner</a>
    </nav>
    <main>
        <h3>Oblicz miesięczną ratę</h3>
        <input type="checkbox" name="react" id="react" class="kontrolki">
        <label for="react">Kurs React.js</label>
        <br>
        <input type="checkbox" name="javascript" id="javascript" class="kontrolki">
        <label for="javascript">Kurs JavaScript</label>
        <br>
        <label for="raty">Liczba rat:</label>
        <input type="number" name="raty" id="raty" class="kontrolki">
        <br>
        <select name="miasto" id="miasto" class="kontrolki">
            <option value="warszawa">Warszawa</option>
            <option value="katowice">Katowice</option>
            <option value="gdansk">Gdańsk</option>
        </select>
        <br>
        <button class="kontrolki" onclick="oblicz()">Oblicz</button>
        <p id="wynikSkryptu"></p>
    </main>
    <footer>
        <p>Autor strony: 00000000000</p>
    </footer>
    <script>
        function oblicz() {
            const wynik = document.getElementById("wynikSkryptu");
            const liczbaRat = document.getElementById("raty").value;
            const react = document.getElementById("react");
            const javascript = document.getElementById("javascript");
            const miasto = document.getElementById("miasto").value;
            let rata = 0;
            let kosztCalkowity = 0;

            if(react.checked) {
                kosztCalkowity += 5000;
            }

            if(javascript.checked) {
                kosztCalkowity += 3000;
            }

            rata = kosztCalkowity / liczbaRat;

            wynik.textContent = `Kurs odbędzie się w ${miasto}. Koszt całkowity:
                ${kosztCalkowity} zł. Płacisz ${liczbaRat} rat po ${rata} zł`;
        }
    </script>
</body>
</html>
